server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The console is a single-page app with real routes. Anything that is not a file on disk
  # has to fall through to the shell, or a judge who refreshes on /defend gets a 404 - which
  # during a demo reads as the site being broken rather than as a server configuration.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed filenames, so these can never be stale. Caching them hard is what makes a second
  # visit instant.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /fonts/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    types { font/woff2 woff2; }
  }

  # The baked payload is a snapshot of a specific run and is replaced wholesale when the run
  # changes. Revalidating keeps a re-baked payload from being masked by a cached one, which
  # would be an interface silently showing yesterday's numbers.
  location /demo/ {
    add_header Cache-Control "no-cache";
  }

  # index.html must never be cached: it is what points at the hashed assets, and a stale copy
  # points at assets that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # The API runs in its own container. Proxying under the same origin means the client has one
  # base URL in both dev and production and no CORS preflight on every read.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Server-sent events for job progress. Without these three the stream is buffered and the
    # progress a long job reports arrives all at once when it finishes, which defeats the
    # point of streaming it.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # woff2 is already compressed; gzipping it costs CPU and saves nothing.

  access_log off;
}
